<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Document Request</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <img src="/inpts/gne_logo.png" alt="GNDEC Logo" class="app-header__logo" onerror="this.style.display='none'">
      <div>
        <p class="app-header__text-main">GNDEC, Ludhiana</p>
        <p class="app-header__text-sub">College Document Services</p>
      </div>
    </header>

    <main class="app-main">
      <div class="request-box">
        <h2>College Document Request Form</h2>

        <form id="studentForm" enctype="multipart/form-data">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your full name" required>

          <label for="roll">Roll Number</label>
          <input type="text" id="roll" name="roll" placeholder="Enter your roll number" required>

          <label for="docType">Document Type</label>
          <select id="docType" name="docType" required>
            <option value="Bonafide Certificate">Bonafide Certificate</option>
            <option value="Fee Receipt">Fee Receipt</option>
            <option value="Character Certificate">Character Certificate</option>
          </select>

          <label for="signature">Digital Signature</label>
          <input type="file" id="signature" name="signature" accept="image/*" required>

          <button type="submit">Submit Request</button>
        </form>

        <div id="msg" style="display: none;"></div>

        <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 8px; text-align: center;">
          <a href="request.html">Student: Request a Certificate</a>
          <a href="status.html">Student: Check Status</a>
          <a href="verify.html">Public: Verify Certificate</a>
          <a href="admin-login.html">Admin Login</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function() {
      const formEl = document.getElementById("studentForm");
      const msgEl = document.getElementById("msg");

      if (!formEl || !msgEl) {
        console.error("Required elements not found");
        return;
      }

      formEl.addEventListener("submit", async (e) => {
        e.preventDefault();
        
        const formData = new FormData(formEl);
        msgEl.style.display = "block";
        msgEl.style.color = "#2c3e50";
        msgEl.style.background = "#e3f2fd";
        msgEl.style.padding = "12px";
        msgEl.style.borderRadius = "6px";
        msgEl.textContent = "Submitting your request...";

        try {
          const res = await fetch("/submit", { 
            method: "POST", 
            body: formData 
          });

          const data = await res.json();

          if (!res.ok) {
            throw new Error(data.error || "Submission failed");
          }

          msgEl.style.background = "#d1fae5";
          msgEl.style.color = "#065f46";
          msgEl.innerHTML = `
            <strong>Success!</strong> ${data.message}<br>
            <a href="status.html?id=${encodeURIComponent(data.data.id)}" style="color: #0056b3; font-weight: 600;">Check Your Request Status</a>
          `;
          formEl.reset();
        } catch (err) {
          console.error("Submission error:", err);
          msgEl.style.background = "#fee2e2";
          msgEl.style.color = "#991b1b";
          msgEl.textContent = err.message || "Unable to submit request. Please try again.";
        }
      });
    })();
  </script>
</body>
</html>
