<!DOCTYPE html>

  <div class="app-shell">

        <p class="app-header__text-sub">Request Review</p>

          <p><strong>Feature Status:</strong> Coming Soon</p>
          <p style="margin-top: 8px; font-size: 14px; color: #64748b;">
            This page will include detailed request information, document preview, and approval workflow.
          </p>
        </div>

        <div style="margin-top: 24px; text-align: center;">
          <a href="admin-dashboard.html">← Back to Dashboard</a>
