<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <img src="/inpts/gne_logo.png" alt="GNDEC Logo" class="app-header__logo" onerror="this.style.display='none'">
      <div>
        <p class="app-header__text-main">GNDEC, Ludhiana</p>
        <p class="app-header__text-sub">Administrator Access</p>
      </div>
    </header>

    <main class="app-main">
      <div class="request-box">
        <h2>Admin Login</h2>
        
        <form method="POST" action="/admin/login">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="username">

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" required autocomplete="current-password">

          <button type="submit">Login</button>
        </form>

        <div style="margin-top: 20px; text-align: center;">
          <a href="index.html">← Back to Home</a>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
