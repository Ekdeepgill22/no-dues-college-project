<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Status</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <img src="/inpts/gne_logo.png" alt="GNDEC Logo" class="app-header__logo" onerror="this.style.display='none'">
      <div>
        <p class="app-header__text-main">GNDEC, Ludhiana</p>
        <p class="app-header__text-sub">Request Status</p>
      </div>
    </header>

    <main class="app-main">
      <div class="request-box">
        <h2>Check Request Status</h2>
        
        <div style="margin-bottom: 16px;">
          <label for="requestId">Request ID</label>
          <input type="text" id="requestId" placeholder="Enter your Request ID">
          <button id="checkBtn" type="button">Check Status</button>
        </div>

        <div id="statusArea"></div>
        <div style="margin-top: 20px; text-align: center;">
          <a href="index.html">← Back to Home</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function() {
      const input = document.getElementById("requestId");
      const btn = document.getElementById("checkBtn");
      const statusArea = document.getElementById("statusArea");

      if (!input || !btn || !statusArea) {
        console.error("Required elements not found");
        return;
      }

      function render(message, isError = false) {
        statusArea.innerHTML = `
          <p style="padding: 14px; margin-top: 12px; border-radius: 6px; 
                     background: ${isError ? '#fee2e2' : '#f8fafc'}; 
                     color: ${isError ? '#991b1b' : '#2c3e50'}; 
                     border: 1px solid ${isError ? '#fecaca' : '#e2e8f0'};">
            ${message}
          </p>
        `;
      }

      async function loadStatus(id) {
        if (!id || !id.trim()) {
          render("Please enter a valid Request ID.", true);
          return;
        }

        render("Loading your request status...");

        try {
          const res = await fetch("/requests");
          if (!res.ok) throw new Error("Unable to load requests");

          const data = await res.json();
          
          if (!Array.isArray(data)) {
            throw new Error("Invalid response from server");
          }

          const req = data.find((r) => String(r.id) === String(id.trim()));

          if (!req) {
            render("No request found for this ID. Please verify and try again.", true);
            return;
          }

          const status = req.requestStatus || req.status || "Pending";
          const certId = req.certificate?.certificateId;
          const certStatus = req.certificate?.status;
          const canDownload = certId && certStatus === "VERIFIED";

          statusArea.innerHTML = `
            <div style="padding: 18px; margin-top: 12px; border-radius: 8px; background: #f8fafc; border: 1px solid #e2e8f0;">
              <p style="margin-bottom: 10px;"><strong>Name:</strong> ${req.name || "N/A"}</p>
              <p style="margin-bottom: 10px;"><strong>Roll Number:</strong> ${req.roll || "N/A"}</p>
              <p style="margin-bottom: 10px;"><strong>Document Type:</strong> ${req.docType || "N/A"}</p>
              <p style="margin-bottom: ${canDownload ? '14px' : '0'};">
                <strong>Status:</strong> 
                <span class="status-badge ${
                  status === 'Approved' ? 'status-badge--verified' : 
                  status === 'Denied' ? 'status-badge--revoked' : 
                  'status-badge--provisional'
                }">${status}</span>
              </p>
              ${canDownload ? `
                <div style="margin-top: 14px; padding-top: 14px; border-top: 1px solid #e2e8f0;">
                  <a href="certificate.html?certificateId=${encodeURIComponent(certId)}" 
                     target="_blank" 
                     rel="noopener" 
                     style="display: inline-block; background: #007bff; color: white; padding: 10px 20px; border-radius: 6px; text-decoration: none; font-weight: 600;">
                    View / Download Certificate
                  </a>
                </div>
              ` : ''}
            </div>
          `;
        } catch (err) {
          console.error("Load status error:", err);
          render("Error loading status. Please try again later.", true);
        }
      }

      btn.addEventListener("click", () => {
        const id = input.value.trim();
        loadStatus(id);
      });

      input.addEventListener("keypress", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          const id = input.value.trim();
          loadStatus(id);
        }
      });

      // Auto-load if ID provided in query string
      const params = new URLSearchParams(window.location.search);
      const initialId = params.get("id");
      if (initialId) {
        input.value = initialId;
        loadStatus(initialId);
      }
    })();
  </script>
</body>
</html>
