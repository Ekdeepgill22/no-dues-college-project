<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <img src="/inpts/gne_logo.png" alt="GNDEC Logo" class="app-header__logo" onerror="this.style.display='none'">
      <div>
        <p class="app-header__text-main">GNDEC, Ludhiana</p>
        <p class="app-header__text-sub">Certificate Verification</p>
      </div>
    </header>

    <main class="app-main">
      <div class="verification">
        <h1>Certificate Verification</h1>
        
        <section id="verifyStatus" class="verification__status">
          Verifying certificate...
        </section>

        <section id="verifyDetails" class="verification__details" hidden>
          <p><strong>Student Name:</strong> <span id="verifyName"></span></p>
          <p><strong>Certificate Type:</strong> <span id="verifyType"></span></p>
          <p><strong>Issue Date:</strong> <span id="verifyIssued"></span></p>
          <p><strong>Status:</strong> <span id="verifyCertStatus"></span></p>
        </section>

        <div style="margin-top: 24px; text-align: center;">
          <a href="index.html">← Back to Home</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function() {
      const statusEl = document.getElementById("verifyStatus");
      const detailsEl = document.getElementById("verifyDetails");

      if (!statusEl || !detailsEl) {
        console.error("Required elements not found");
        return;
      }

      const safeText = (val, fallback = "N/A") =>
        val === null || val === undefined || val === "" ? fallback : String(val);

      const formatDate = (val) => {
        if (!val) return "N/A";
        try {
          const d = new Date(val);
          return isNaN(d.getTime()) ? safeText(val) : d.toLocaleString();
        } catch {
          return safeText(val);
        }
      };

      async function verify() {
        const params = new URLSearchParams(window.location.search);
        const certificateId = params.get("certificateId");

        if (!certificateId) {
          statusEl.textContent = "Certificate ID is missing from the URL.";
          statusEl.className = "verification__status verification__status--error";
          return;
        }

        statusEl.textContent = "Verifying certificate, please wait...";
        statusEl.className = "verification__status";

        try {
          const res = await fetch(`/certificates/${encodeURIComponent(certificateId)}`);

          if (!res.ok) {
            throw new Error("Certificate not found");
          }

          const record = await res.json();
          const cert = record.certificate || {};

          const certStatus = safeText(cert.status).toUpperCase();
          const humanStatus =
            certStatus === "VERIFIED" ? "Verified" :
            certStatus === "REVOKED" ? "Revoked" :
            "Invalid";

          document.getElementById("verifyName").textContent = safeText(record.name);
          document.getElementById("verifyType").textContent = safeText(record.docType);
          document.getElementById("verifyIssued").textContent = formatDate(cert.issuedOn);
          document.getElementById("verifyCertStatus").textContent = humanStatus;

          statusEl.textContent = `Certificate Status: ${humanStatus}`;
          statusEl.className = `verification__status ${
            certStatus === "VERIFIED" ? "verification__status--ok" :
            certStatus === "REVOKED" ? "verification__status--warn" :
            "verification__status--error"
          }`;

          detailsEl.hidden = false;

        } catch (err) {
          console.error("Verification error:", err);
          statusEl.textContent = "Certificate is invalid or not found in our records.";
          statusEl.className = "verification__status verification__status--error";
          detailsEl.hidden = true;
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', verify);
      } else {
        verify();
      }
    })();
  </script>
</body>
</html>
